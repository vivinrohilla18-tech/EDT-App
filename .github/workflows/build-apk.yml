name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/create-minimal-app-ndomw
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install JS dependencies
        run: |
          set -o pipefail
          npm install --legacy-peer-deps 2>&1 | tee /tmp/npm.log

      - name: Show npm error
        if: failure()
        run: |
          echo "::error::=== NPM INSTALL FAILED ==="
          grep -i "error\|ERESOLVE\|peer\|404\|not found" /tmp/npm.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Fix gradle plugin path
        run: |
          if [ ! -d "node_modules/@react-native/gradle-plugin" ]; then
            PLUGIN=$(find node_modules -type d -name "gradle-plugin" -path "*/@react-native/gradle-plugin" 2>/dev/null | head -1)
            if [ -n "$PLUGIN" ]; then
              mkdir -p node_modules/@react-native
              ln -sfn "$(pwd)/$PLUGIN" node_modules/@react-native/gradle-plugin
              echo "::notice::Symlinked gradle-plugin from $PLUGIN"
            else
              echo "::error::@react-native/gradle-plugin not found anywhere in node_modules"
              exit 1
            fi
          else
            echo "::notice::gradle-plugin already at node_modules/@react-native/gradle-plugin"
          fi

      - name: Install Gradle 8.3
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.3-bin.zip -o /tmp/gradle.zip
          unzip -qq /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.3/bin" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393"

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Check project structure
        run: |
          echo "Node version: $(node --version)"
          echo "ANDROID_HOME: $ANDROID_HOME"
          if ls node_modules/@react-native/gradle-plugin 2>/dev/null; then
            echo "::notice::gradle-plugin found"
          else
            echo "::error::gradle-plugin MISSING"
          fi
          if ls node_modules/react-native-bluetooth-classic 2>/dev/null; then
            echo "::notice::bluetooth-classic found"
          else
            echo "::error::bluetooth-classic MISSING"
          fi

      - name: Build debug APK
        id: gradle_build
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Show build error
        if: failure() && steps.gradle_build.outcome == 'failure'
        run: |
          echo "::error::=== FIRST 60 LINES ==="
          head -60 /tmp/build.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "::error::=== ERROR SUMMARY ==="
          grep -n "FAILURE\|What went wrong\|Caused by\|Exception:\|error:" /tmp/build.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Find APK
        if: always()
        run: find android -name "*.apk" 2>/dev/null || echo "No APK found"

      - uses: actions/upload-artifact@v4
        with:
          name: EDT-LED-Controller-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
