<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDT Traffic Light Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d1a; color: #ccc; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
    }
    header {
      width: 100%; background: #12122a; border-bottom: 1px solid #1e1e3f;
      padding: 20px; text-align: center;
    }
    header h1 { font-size: 22px; font-weight: bold; color: #e94560; letter-spacing: 1px; }
    header p { font-size: 11px; color: #555; letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }
    .container { width: 100%; max-width: 420px; padding: 16px; }

    .status-bar {
      display: flex; align-items: center; gap: 10px; padding: 14px;
      border-radius: 10px; margin-bottom: 16px; border: 1px solid; transition: all 0.3s;
    }
    .status-bar.disconnected { background: #2a0a0a; border-color: #6a2a2a; }
    .status-bar.connected    { background: #0a2a0a; border-color: #2a6a2a; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .status-bar.disconnected .dot { background: #F44336; }
    .status-bar.connected .dot    { background: #4CAF50; }

    /* Traffic light visual */
    .traffic-box {
      margin: 16px auto 24px; background: #1a1a1a; border-radius: 40px;
      padding: 14px; display: flex; flex-direction: column; align-items: center;
      gap: 10px; width: 80px; border: 2px solid #333;
    }
    .light { width: 52px; height: 52px; border-radius: 50%; transition: all 0.3s; }
    .light.red-off    { background: #5a1a1a; }
    .light.red-on     { background: #F44336; box-shadow: 0 0 20px 6px rgba(244,67,54,0.5); }
    .light.yellow-off { background: #5a4a00; }
    .light.yellow-on  { background: #FFC107; box-shadow: 0 0 20px 6px rgba(255,193,7,0.5); }
    .light.green-off  { background: #1a3a1a; }
    .light.green-on   { background: #4CAF50; box-shadow: 0 0 20px 6px rgba(76,175,80,0.5); }

    button {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
      margin-bottom: 10px; letter-spacing: 0.5px; transition: opacity 0.2s, transform 0.1s;
    }
    button:hover:not(:disabled) { opacity: 0.88; }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #btn-connect { background: #1565c0; }
    #btn-red     { background: #F44336; }
    #btn-yellow  { background: #F9A825; color: #000; }
    #btn-green   { background: #4CAF50; }
    #btn-auto    { background: #1565c0; }
    #btn-auto.active { background: #0d47a1; border: 2px solid #42a5f5; }
    #btn-off     { background: #555; }
    #btn-disconnect { background: #333; margin-top: 6px; }

    .note {
      background: #12122a; border: 1px solid #1e1e3f; border-radius: 8px;
      padding: 14px; font-size: 13px; color: #666; line-height: 1.6; margin-top: 4px;
    }
    .note strong { color: #aaa; }
    .note code { background: #1e1e3f; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #e94560; }

    #log {
      margin-top: 16px; background: #0a0a14; border: 1px solid #1e1e3f;
      border-radius: 8px; padding: 10px; font-size: 12px; font-family: monospace;
      color: #4CAF50; height: 90px; overflow-y: auto;
    }
    #log .err { color: #F44336; }
  </style>
</head>
<body>

<header>
  <h1>EDT Traffic Light</h1>
  <p>Web USB Serial &mdash; Arduino</p>
</header>

<div class="container">
  <div class="status-bar disconnected" id="status-bar">
    <div class="dot"></div>
    <span id="status-text">Not Connected</span>
  </div>

  <!-- Traffic light visual -->
  <div class="traffic-box" id="traffic-box" style="display:none;">
    <div class="light red-off" id="light-r"></div>
    <div class="light yellow-off" id="light-y"></div>
    <div class="light green-off" id="light-g"></div>
  </div>

  <!-- Connect panel -->
  <div id="panel-disconnected">
    <button id="btn-connect" onclick="connectSerial()">Connect to Arduino</button>
    <div class="note">
      <strong>Requirements:</strong><br>
      &bull; Use <strong>Chrome</strong> or <strong>Edge</strong> browser<br>
      &bull; Plug Arduino into laptop via <strong>USB cable</strong><br>
      &bull; Upload the traffic light Arduino sketch first<br>
      &bull; Baud rate: <code>9600</code>
    </div>
  </div>

  <!-- Control panel -->
  <div id="panel-connected" style="display:none;">
    <button id="btn-red" onclick="sendCommand('R')">Red</button>
    <button id="btn-yellow" onclick="sendCommand('Y')">Yellow</button>
    <button id="btn-green" onclick="sendCommand('G')">Green</button>
    <button id="btn-auto" onclick="startAuto()">Auto Cycle</button>
    <button id="btn-off" onclick="sendCommand('X')">All OFF</button>
    <button id="btn-disconnect" onclick="disconnectSerial()">Disconnect</button>
  </div>

  <div id="log">&gt; Ready. Connect your Arduino to begin.</div>
</div>

<script>
  let port = null, writer = null;
  let autoTimer = null;

  function log(msg, isError) {
    const el = document.getElementById('log');
    const line = document.createElement('div');
    if (isError) line.className = 'err';
    line.textContent = '> ' + msg;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  function setConnected(name) {
    document.getElementById('status-bar').className = 'status-bar connected';
    document.getElementById('status-text').textContent = 'Connected: ' + name;
    document.getElementById('panel-disconnected').style.display = 'none';
    document.getElementById('panel-connected').style.display = 'block';
    document.getElementById('traffic-box').style.display = 'flex';
    setLight(null);
  }

  function setDisconnected() {
    document.getElementById('status-bar').className = 'status-bar disconnected';
    document.getElementById('status-text').textContent = 'Not Connected';
    document.getElementById('panel-disconnected').style.display = 'block';
    document.getElementById('panel-connected').style.display = 'none';
    document.getElementById('traffic-box').style.display = 'none';
    stopAuto();
    setLight(null);
  }

  function setLight(active) {
    document.getElementById('light-r').className = 'light ' + (active === 'R' ? 'red-on' : 'red-off');
    document.getElementById('light-y').className = 'light ' + (active === 'Y' ? 'yellow-on' : 'yellow-off');
    document.getElementById('light-g').className = 'light ' + (active === 'G' ? 'green-on' : 'green-off');
  }

  function stopAuto() {
    clearInterval(autoTimer);
    autoTimer = null;
    document.getElementById('btn-auto').className = '';
  }

  async function connectSerial() {
    if (!('serial' in navigator)) { log('Web Serial API not supported. Use Chrome or Edge.', true); return; }
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      writer = port.writable.getWriter();
      const info = port.getInfo();
      setConnected('USB Serial (' + (info.usbVendorId || 'Arduino') + ')');
      log('Connected at 9600 baud.');
    } catch (e) { log('Connection failed: ' + e.message, true); }
  }

  async function sendCommand(cmd) {
    if (!writer) { log('Not connected.', true); return; }
    if (cmd !== 'A') stopAuto();
    try {
      await writer.write(new TextEncoder().encode(cmd));
      const names = {R: 'RED', Y: 'YELLOW', G: 'GREEN', A: 'AUTO', X: 'ALL OFF'};
      log('Sent: ' + (names[cmd] || cmd));
      if (cmd === 'X') setLight(null);
      else if (cmd !== 'A') setLight(cmd);
    } catch (e) { log('Send error: ' + e.message, true); }
  }

  async function startAuto() {
    await sendCommand('A');
    let step = 0;
    const sequence = ['R', 'Y', 'G'];
    const times = [3000, 1000, 3000];
    setLight(sequence[step]);
    document.getElementById('btn-auto').className = 'active';

    stopAuto();
    autoTimer = setInterval(() => {
      step = (step + 1) % 3;
      setLight(sequence[step]);
    }, times[step]);
  }

  async function disconnectSerial() {
    stopAuto();
    try {
      if (writer) { writer.releaseLock(); writer = null; }
      if (port) { await port.close(); port = null; }
    } catch (_) {}
    setDisconnected();
    log('Disconnected.');
  }
</script>
</body>
</html>
